name: Keep Render & Supabase Active

on:
  schedule:
    # Runs every 12 minutes (Render free tier sleeps after 15 mins of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ping Keep-Alive Endpoint
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::error::RENDER_URL secret is not configured!"
            echo "Please go to: Repository Settings -> Secrets and variables -> Actions"
            echo "Add a new repository secret named RENDER_URL with your Render app URL (e.g. https://your-service.onrender.com)"
            exit 1
          fi
          python3 keep_alive.py --once
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
